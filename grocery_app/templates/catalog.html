{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>Catalog</h1></div>

<details class="add-form" open>
  <summary>Add / update an item</summary>
  <form method="post" action="{{ url_for('main.add_item') }}" class="grid-form">
    <input name="name" placeholder="Item name" required>
    <select name="category">
      {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
    </select>
    <select name="source">
      {% for key, label in source_labels.items() %}
        <option value="{{ key }}">{{ label }}</option>
      {% endfor %}
    </select>
    <input name="note" placeholder="Note (optional)">
    <button class="btn primary" type="submit">Save</button>
  </form>
</details>

<table class="catalog-table">
  <thead><tr><th>Item</th><th>Category</th><th>Source</th><th></th></tr></thead>
  <tbody>
  {% for it in items %}
    <tr>
      <td>{{ it.name }}{% if it.note %}<small> · {{ it.note }}</small>{% endif %}</td>
      <td>{{ it.category }}</td>
      <td>{{ source_labels.get(it.source, it.source) }}</td>
      <td><button class="del" data-delitem="{{ it.id }}" aria-label="delete">✕</button></td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
